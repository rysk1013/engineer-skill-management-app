services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --hostname 0.0.0.0

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
    command: php artisan serve --host=0.0.0.0 --port=8000

  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: engineer_skill_management
      POSTGRES_USER: app
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U app -d engineer_skill_management
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  frontend_node_modules:
  backend_vendor:
  postgres_data:
