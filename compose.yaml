services:
  openapi:
    build:
      context: ./openapi
      dockerfile: Dockerfile
    volumes:
      - ./openapi:/app
      - ./frontend/src/lib/api/generated:/frontend/src/lib/api/generated
      - openapi_node_modules:/app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      BACKEND_API_URL: ${BACKEND_API_URL}
    networks:
      - frontend

  nginx:
    build:
      context: ./backend
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "8000:80"
    volumes:
      - ./backend/public:/app/public:ro
      - ./backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend
      - backend
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: engineer_skill_management
      POSTGRES_USER: app
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U app -d engineer_skill_management
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  test-db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: engineer_skill_management_test
      POSTGRES_USER: app
      POSTGRES_PASSWORD: password
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U app -d engineer_skill_management_test
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  openapi_node_modules:
  frontend_node_modules:
  backend_vendor:
  postgres_data:

networks:
  frontend:
  backend:
