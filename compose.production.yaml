name: engineer-skill-management-app-prod

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    ports:
      - "3000:3000"
    environment:
      BACKEND_API_URL: ${BACKEND_API_URL}
    networks:
      - frontend
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    build:
      context: ./backend
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "8000:80"
    networks:
      - frontend
      - backend
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    expose:
      - "9000"
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}

      LOG_CHANNEL: stack
      LOG_STACK: single
      LOG_LEVEL: ${LOG_LEVEL:-info}

      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8.2.10-bookworm
    environment:
      REDIS_BETTER_AUTH_PASSWORD: ${REDIS_BETTER_AUTH_PASSWORD}
      REDIS_BACKEND_CREDENTIAL_PASSWORD: ${REDIS_BACKEND_CREDENTIAL_PASSWORD}
    volumes:
      - ./docker/redis/redis.conf:/etc/redis/redis.conf:ro
      - ./docker/redis/docker-entrypoint.sh:/usr/local/bin/redis-entrypoint.sh:ro
      - redis_data:/data
    networks:
      - frontend
    entrypoint:
      - /usr/local/bin/redis-entrypoint.sh
    healthcheck:
      test:
        - CMD-SHELL
        - test "$$(redis-cli --user better-auth --pass "$$REDIS_BETTER_AUTH_PASSWORD" --no-auth-warning PING)" = "PONG"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
  redis_data:

networks:
  frontend:
  backend:
